apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: postgresql-init
    namespace: database
    files:
      - init/01-create-keycloak-db.sh

generatorOptions:
  disableNameSuffixHash: true
  