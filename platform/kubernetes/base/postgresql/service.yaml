apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: database
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: cloud-native-lab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
      