apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: cloud-native-lab
spec:
  serviceName: minio-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: minio

  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: cloud-native-lab

    spec:
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: registry-pull-credentials

      containers:
        - name: minio

          image: registry.nst.art.br/minio-community:7aac2a2
          imagePullPolicy: IfNotPresent

          args:
            - server
            - /data
            - --console-address
            - ":9001"

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD

          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP

            - name: console
              containerPort: 9001
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
            