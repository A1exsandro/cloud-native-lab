apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: cloud-native-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: cloud-native-lab
    spec:
      containers:
        - name: registry
          image: registry:3.1.2
          imagePullPolicy: IfNotPresent

          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry

            - name: REGISTRY_AUTH
              value: htpasswd

            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: Registry Realm

            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd

            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: registry-runtime
                  key: http-secret

            - name: OTEL_TRACES_EXPORTER
              value: none

          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /var/lib/registry

            - name: auth
              mountPath: /auth
              readOnly: true

          readinessProbe:
            tcpSocket:
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: registry
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data

        - name: auth
          secret:
            secretName: registry-auth
            items:
              - key: htpasswd
                path: htpasswd
                