apiVersion: apps/v1
kind: Deployment
metadata:
  name: vocabulary-app
  namespace: vocabulary
  labels:
    app.kubernetes.io/name: vocabulary-app
    app.kubernetes.io/part-of: vocabulary

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: vocabulary-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: vocabulary-app
        app.kubernetes.io/part-of: vocabulary

    spec:
      imagePullSecrets:
        - name: registry-pull-credentials

      containers:
        - name: vocabulary-app
          image: registry.nst.art.br/vocabulary-app:0.0.4
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
