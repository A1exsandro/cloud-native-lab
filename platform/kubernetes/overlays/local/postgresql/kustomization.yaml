apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/postgresql

secretGenerator:
  - name: postgresql-credentials
    namespace: database
    literals:
      - POSTGRES_USER=postgres_admin
    files:
      - POSTGRES_PASSWORD=secrets/postgres-password

generatorOptions:
  disableNameSuffixHash: true
  