apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/registry
  - ingress.yaml

secretGenerator:
  - name: registry-auth
    namespace: registry
    files:
      - htpasswd=secrets/htpasswd

  - name: registry-runtime
    namespace: registry
    files:
      - http-secret=secrets/http-secret

generatorOptions:
  disableNameSuffixHash: true
  