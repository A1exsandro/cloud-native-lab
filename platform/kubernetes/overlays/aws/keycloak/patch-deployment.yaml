apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  template:
    spec:
      containers:
        - name: keycloak
          args:
            - start
            - --http-enabled=true
            - --hostname=https://keycloak.nst.art.br
            - --proxy-headers=xforwarded
            