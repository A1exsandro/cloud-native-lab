apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/minio
  - ingress.yaml

secretGenerator:
  - name: minio-credentials
    namespace: storage
    files:
      - MINIO_ROOT_USER=secrets/root-user
      - MINIO_ROOT_PASSWORD=secrets/root-password

generatorOptions:
  disableNameSuffixHash: true
  