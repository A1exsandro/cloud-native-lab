apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vocabulary-app
  namespace: vocabulary

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - vocabulary.nst.art.br
      secretName: vocabulary-tls

  rules:
    - host: vocabulary.nst.art.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vocabulary-app
                port:
                  number: 80
                  