---
- name: Ensure administrative users exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | join(',') }}"
    append: true
    shell: "{{ item.shell }}"
    state: "{{ item.state }}"
    create_home: true
  loop: "{{ users_admin }}"

- name: Configure passwordless sudo for administrative users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ users_admin }}"
  