---
- name: Install K3s prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: "{{ k3s_config_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure K3s server
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s

- name: Download official K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/k3s-install.sh
    owner: root
    group: root
    mode: "0755"

- name: Install K3s server
  ansible.builtin.command:
    cmd: /bin/sh /usr/local/src/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  args:
    creates: /etc/systemd/system/k3s.service

- name: Ensure K3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: "{{ k3s_service_enabled }}"
    state: "{{ k3s_service_state }}"
    daemon_reload: true

- name: Create remote kubeconfig directory
  ansible.builtin.file:
    path: "{{ k3s_admin_home }}/.kube"
    state: directory
    owner: "{{ k3s_admin_user }}"
    group: "{{ k3s_admin_group }}"
    mode: "0700"

- name: Configure kubeconfig for remote administrator
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_admin_home }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_admin_user }}"
    group: "{{ k3s_admin_group }}"
    mode: "0600"

- name: Create local kubeconfig directory
  ansible.builtin.file:
    path: "{{ k3s_local_kubeconfig | dirname }}"
    state: directory
    mode: "0700"
  become: false
  delegate_to: localhost

- name: Fetch K3s kubeconfig to workstation
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_local_kubeconfig }}"
    flat: true

- name: Configure API server address in local kubeconfig
  ansible.builtin.replace:
    path: "{{ k3s_local_kubeconfig }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ k3s_node_ip }}:6443"
  delegate_to: localhost
  become: false

- name: Protect local kubeconfig permissions
  ansible.builtin.file:
    path: "{{ k3s_local_kubeconfig }}"
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Configure K3s environment for administrator
  ansible.builtin.lineinfile:
    path: "{{ k3s_admin_home }}/.bashrc"
    regexp: "^export {{ item.name }}="
    line: "export {{ item.name }}={{ item.value }}"
    owner: "{{ k3s_admin_user }}"
    group: "{{ k3s_admin_group }}"
    mode: "0644"
  loop:
    - name: KUBECONFIG
      value: '"$HOME/.kube/config"'
    - name: K3S_CONFIG_FILE
      value: /dev/null
