### Localization
d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string cnl-debian13-node01
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string America/Cuiaba
d-i clock-setup/ntp boolean true

### APT mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Cloud Native Administrator
d-i passwd/username string cnladmin
d-i passwd/user-password-crypted password __USER_PASSWORD_CRYPTED__

### Partitioning
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/choose_partition select finish
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Package selection
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo qemu-guest-agent curl wget vim git ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Serial console
d-i grub-installer/add-kernel-opts string console=tty0 console=ttyS0,115200n8

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

### SSH key and post-install configuration
d-i preseed/late_command string \
    in-target usermod -aG sudo cnladmin; \
    in-target install -d -o cnladmin -g cnladmin -m 0700 /home/cnladmin/.ssh; \
    echo '__SSH_PUBLIC_KEY_B64__' | base64 -d > /target/home/cnladmin/.ssh/authorized_keys; \
    in-target chown cnladmin:cnladmin /home/cnladmin/.ssh/authorized_keys; \
    in-target chmod 0600 /home/cnladmin/.ssh/authorized_keys; \
    in-target systemctl enable qemu-guest-agent; \
    in-target systemctl enable serial-getty@ttyS0.service
    
### Finish
d-i finish-install/reboot_in_progress note
